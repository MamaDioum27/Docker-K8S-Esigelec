# ---------- 1. Secret : le mot de passe de la base ----------
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret
type: Opaque
stringData:
  password: user
---
# ---------- 2. Base de données MariaDB ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
      - name: mariadb
        image: mariadb:latest
        ports:
        - containerPort: 3306
        env:
        - name: MARIADB_DATABASE
          value: todo
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: password
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
spec:
  type: ClusterIP
  selector:
    app: mariadb
  ports:
  - port: 3306
    targetPort: 3306
---
# ---------- 3. Backend (API Node.js) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todobackend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todobackend
  template:
    metadata:
      labels:
        app: todobackend
    spec:
      initContainers:
      - name: wait-for-mariadb
        image: busybox:1.36
        command: ["sh", "-c", "until nc -z mariadb 3306; do echo 'attente de mariadb...'; sleep 2; done"]
      containers:
      - name: todobackend
        image: todobackend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_SVC
          value: mariadb
        - name: DATABASE_PORT
          value: "3306"
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: password
---
apiVersion: v1
kind: Service
metadata:
  name: todobackend
spec:
  type: ClusterIP
  selector:
    app: todobackend
  ports:
  - port: 3000
    targetPort: 3000
---
# ---------- 4. Frontend (React + nginx) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todofrontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todofrontend
  template:
    metadata:
      labels:
        app: todofrontend
    spec:
      containers:
      - name: todofrontend
        image: todofrontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: todofrontend
spec:
  type: NodePort
  selector:
    app: todofrontend
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080